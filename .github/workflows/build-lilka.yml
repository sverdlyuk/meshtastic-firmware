name: Build Meshtastic (Lilka)

# Запуск вручну з вкладки Actions (кнопка "Run workflow").
on:
  workflow_dispatch:

jobs:
  build-lilka:
    runs-on: ubuntu-latest
    env:
      # Тримаємо setuptools<72 для БУДЬ-ЯКОГО pip у цьому job, включно з тим,
      # що PlatformIO/nanopb запускає у власному середовищі під час збірки.
      # Новий setuptools (grpcio-tools тягне 84) ламає SCons усередині
      # PlatformIO -> "No module named 'SCons.Tool.FortranCommon'".
      PIP_CONSTRAINT: ${{ github.workspace }}/pip-constraints.txt
    steps:
      - name: Checkout Meshtastic + Lilka target (PR #9131)
        uses: actions/checkout@v4
        with:
          repository: meshtastic/firmware
          ref: refs/pull/9131/head
          submodules: recursive
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Create pip constraints
        run: echo "setuptools<72" > "${{ github.workspace }}/pip-constraints.txt"

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install "setuptools<72"
          pip install platformio

      - name: Build firmware (env:lilka)
        run: pio run -e lilka

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: meshtastic-lilka
          if-no-files-found: warn
          path: |
            .pio/build/lilka/*.bin
            .pio/build/lilka/*.uf2
            .pio/build/lilka/*.elf
