name: Build Meshtastic Lilka

on:
  workflow_dispatch:

jobs:
  build-lilka:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Meshtastic + Lilka target (PR #9131)
        uses: actions/checkout@v4
        with:
          repository: meshtastic/firmware
          ref: refs/pull/9131/head
          submodules: recursive
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # PlatformIO Core 6.2.0 має баг з tool-scons на framework=espidf
      # (стирає SCons посеред збірки -> "No module named
      # 'SCons.Tool.FortranCommon'"). Тому пінимо останню робочу версію 6.1.19.
      - name: Install PlatformIO (pinned 6.1.19)
        run: |
          python -m pip install --upgrade pip
          pip install "platformio==6.1.19"

      - name: Build firmware (env:lilka)
        run: pio run -e lilka

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: meshtastic-lilka
          if-no-files-found: warn
          path: |
            .pio/build/lilka/*.bin
            .pio/build/lilka/*.uf2
            .pio/build/lilka/*.elf
