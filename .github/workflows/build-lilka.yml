name: Build Meshtastic (Lilka)

# Запуск вручну з вкладки Actions (кнопка "Run workflow").
on:
  workflow_dispatch:

jobs:
  build-lilka:
    runs-on: ubuntu-latest
    steps:
      # Беремо код Meshtastic разом із таргетом Лілки з PR #9131.
      # (У форку sverdlyuk/meshtastic-firmware цих файлів ще немає.)
      - name: Checkout Meshtastic + Lilka target (PR #9131)
        uses: actions/checkout@v4
        with:
          repository: meshtastic/firmware
          ref: refs/pull/9131/head
          submodules: recursive
          fetch-depth: 1

      # Офіційна дія збірки Meshtastic. Вона сама ставить PlatformIO з
      # правильними версіями (у т.ч. лагодить SCons/setuptools) і збирає env.
      - name: Build firmware (env:lilka)
        uses: meshtastic/gh-action-firmware@main
        with:
          pio_platform: esp32s3
          pio_env: lilka
          pio_target: build

      # Готові прошивки дія складає в теку release/.
      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: meshtastic-lilka
          if-no-files-found: warn
          path: release/
