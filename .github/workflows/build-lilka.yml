name: Build Meshtastic Lilka

on:
  workflow_dispatch:

jobs:
  build-lilka:
    runs-on: ubuntu-latest

    # pioarduino створює окреме Python-середовище для другого етапу
    # збірки. Обмеження не дозволяє йому оновитися до 6.2.0 і
    # замінити SCons 4.8.1 на несумісний SCons 4.11.1.
    env:
      UV_CONSTRAINT: ${{ runner.temp }}/pio-constraints.txt

    steps:
      - name: Checkout Meshtastic + Lilka target (PR #9131)
        uses: actions/checkout@v4
        with:
          repository: meshtastic/firmware
          ref: refs/pull/9131/head
          submodules: recursive
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PlatformIO and pin nested pioarduino
        run: |
          printf '%s\n' 'pioarduino==6.1.19' > "$UV_CONSTRAINT"

          python -m pip install --upgrade pip
          python -m pip install "platformio==6.1.19"

          echo "=== PlatformIO version ==="
          pio --version

          echo "=== UV constraints ==="
          cat "$UV_CONSTRAINT"

      # Platform 55.03.311 використовує SCons 4.8.1 і сумісна
      # з PlatformIO/pioarduino Core 6.1.19.
      - name: Pin pioarduino platform to 55.03.311
        run: |
          sed -i \
            's#download/55\.03\.39/#download/55.03.311/#' \
            variants/esp32/esp32-common.ini

          echo "=== Platform configuration ==="
          grep -n \
            "pioarduino/platform-espressif32/releases/download" \
            variants/esp32/esp32-common.ini

      - name: Build firmware (env:lilka)
        run: pio run -e lilka

      - name: Upload firmware artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: meshtastic-lilka
          if-no-files-found: warn
          path: |
            .pio/build/lilka/*.bin
            .pio/build/lilka/*.uf2
            .pio/build/lilka/*.elf
