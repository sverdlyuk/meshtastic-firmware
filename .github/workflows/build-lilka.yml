name: Build Meshtastic Lilka

on:
  workflow_dispatch:

jobs:
  build-lilka:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Meshtastic + Lilka target (PR #9131)
        uses: actions/checkout@v4
        with:
          repository: meshtastic/firmware
          ref: refs/pull/9131/head
          submodules: recursive
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install platformio

      - name: Build firmware (env:lilka)
        run: |
          set -e
          echo "::group::First pass (expected to fail at link)"
          pio run -e lilka || echo "first pass failed as expected, fixing env..."
          echo "::endgroup::"

          PENV_PY="$HOME/.platformio/penv/bin/python"
          if [ ! -x "$PENV_PY" ]; then
            echo "penv python not found; listing ~/.platformio"; ls -la "$HOME/.platformio" || true; exit 1
          fi
          "$PENV_PY" -m pip install "setuptools<72" "grpcio-tools==1.62.3" "protobuf>=4.21.6,<5"
          "$PENV_PY" -c "import grpc_tools.protoc, google.protobuf, setuptools; print('OK grpc_tools, setuptools', setuptools.__version__)"

          echo "::group::Second pass (real build)"
          pio run -e lilka
          echo "::endgroup::"

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: meshtastic-lilka
          if-no-files-found: warn
          path: |
            .pio/build/lilka/*.bin
            .pio/build/lilka/*.uf2
            .pio/build/lilka/*.elf
