name: Build Meshtastic Lilka

on:
  workflow_dispatch:

jobs:
  build-lilka:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Meshtastic + Lilka target (PR #9131)
        uses: actions/checkout@v4
        with:
          repository: meshtastic/firmware
          ref: refs/pull/9131/head
          submodules: recursive
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Перевірена мейнтейнером pioarduino пара: платформа 55.03.311 + ядро
      # 6.1.19. Новіші платформи вимагають core>=6.2.0, через що PlatformIO
      # самооновлюється до зламаного 6.2.0.post1 і видаляє платформу
      # посеред збірки. 55.03.311 сумісна саме з 6.1.19 і не змушує оновлення.
      - name: Install PlatformIO (pinned 6.1.19)
        run: |
          python -m pip install --upgrade pip
          pip install "platformio==6.1.19"

      # Платформа 55.03.39 змушує PlatformIO оновитись до core 6.2.0, а та
      # версія платформи дає розбіжність tool-scons і ламає SCons
      # ("No module named 'SCons.Tool.FortranCommon'"). Новіша платформа
      # 55.03.312-1 узгоджена з core 6.2.0 і цей баг не має.
      # Платформа 55.03.311 — та, що мейнтейнер підтверджує робочою з core 6.1.19.
      - name: Pin pioarduino platform to 55.03.311
        run: |
          sed -i 's#download/55\.03\.39/#download/55.03.311/#' variants/esp32/esp32-common.ini
          echo "=== platform line now ==="
          grep -n "pioarduino/platform-espressif32/releases/download" variants/esp32/esp32-common.ini

      - name: Build firmware (env:lilka)
        run: pio run -e lilka

      - name: Upload firmware artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: meshtastic-lilka
          if-no-files-found: warn
          path: |
            .pio/build/lilka/*.bin
            .pio/build/lilka/*.uf2
            .pio/build/lilka/*.elf
